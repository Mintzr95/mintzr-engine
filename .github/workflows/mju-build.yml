name: MJU Engine CI

on:
  push:
    branches: [main, mju-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DMJU_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mju-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
